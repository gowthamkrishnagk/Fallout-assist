<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>
    .actor { fill:#f8fafc; stroke:#0f172a; stroke-width:2px; rx:8px; }
    .system { fill:#0f172a; stroke:#111827; stroke-width:3px; rx:18px; }
    .usecase { fill:#eef2ff; stroke:#1e293b; stroke-width:2px; rx:40px; }
    .label { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; fill:#071029; font-size:14px; }
    .actor-label { font-size:13px; fill:#0f172a; }
    .connector { stroke:#0b1220; stroke-width:2px; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1220" />
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="40" y="60" width="160" height="48" class="actor"/>
  <text x="120" y="92" text-anchor="middle" class="actor-label">Support Agent</text>

  <rect x="40" y="150" width="160" height="48" class="actor"/>
  <text x="120" y="182" text-anchor="middle" class="actor-label">System Admin</text>

  <rect x="40" y="240" width="160" height="48" class="actor"/>
  <text x="120" y="272" text-anchor="middle" class="actor-label">Ingest Scheduler</text>

  <rect x="1000" y="60" width="120" height="48" class="actor"/>
  <text x="1060" y="92" text-anchor="middle" class="actor-label">Jira</text>

  <!-- System box -->
  <rect x="240" y="30" width="720" height="620" class="system"/>
  <text x="600" y="60" text-anchor="middle" class="label" style="fill:#e6eef8; font-size:18px;">FalloutAssist</text>

  <!-- Use cases inside system -->
  <g id="usecases">
    <ellipse cx="520" cy="140" rx="180" ry="36" class="usecase"/>
    <text x="520" y="145" text-anchor="middle" class="label">Index tickets & documents</text>

    <ellipse cx="520" cy="230" rx="220" ry="36" class="usecase"/>
    <text x="520" y="235" text-anchor="middle" class="label">Extract step & error</text>

    <ellipse cx="520" cy="320" rx="240" ry="36" class="usecase"/>
    <text x="520" y="325" text-anchor="middle" class="label">Embed step & error (local)</text>

    <ellipse cx="520" cy="410" rx="260" ry="36" class="usecase"/>
    <text x="520" y="415" text-anchor="middle" class="label">Store vectors in Chroma</text>

    <ellipse cx="520" cy="500" rx="260" ry="36" class="usecase"/>
    <text x="520" y="505" text-anchor="middle" class="label">Retrieve & Rank (Vector + BM25 + Graph)</text>

    <ellipse cx="520" cy="580" rx="200" ry="36" class="usecase"/>
    <text x="520" y="585" text-anchor="middle" class="label">Optional LLM re-rank / synthesize</text>
  </g>

  <!-- Connectors from actors to use-cases -->
  <line x1="200" y1="84" x2="340" y2="140" class="connector" />
  <line x1="200" y1="172" x2="340" y2="230" class="connector" />
  <line x1="200" y1="260" x2="340" y2="320" class="connector" />

  <!-- Jira connector to ingest & suggest -->
  <line x1="1000" y1="84" x2="840" y2="140" class="connector" />
  <line x1="1000" y1="84" x2="840" y2="500" class="connector" />

  <!-- Internal flows (system) -->
  <line x1="520" y1="176" x2="520" y2="194" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="266" x2="520" y2="284" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="356" x2="520" y2="374" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="446" x2="520" y2="474" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="536" x2="520" y2="564" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels for external flows -->
  <text x="270" y="120" class="label">Ask / Upload</text>
  <text x="270" y="210" class="label">Configure LLM & keys</text>
  <text x="270" y="300" class="label">Auto-ingest trigger</text>
  <text x="900" y="120" class="label">Ticket data source</text>
  <text x="900" y="520" class="label">Target for auto-suggestions</text>

  <!-- Footer note -->
  <text x="600" y="690" text-anchor="middle" class="label" style="font-size:12px; fill:#9fb0cc;">Use case diagram: Support Agent / Admin / Scheduler / Jira interact with FalloutAssist</text>
</svg>
